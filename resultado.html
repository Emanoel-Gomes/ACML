<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualização – ACML</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="upload.css">
</head>
<body class="page-upload page-resultado">
<a class="skip" href="#vizTela">Pular para a imagem</a>

</header>

<main id="conteudo" class="card" tabindex="-1">
  <h1 class="res-titulo">Visualização</h1>
  <p class="res-arquivo" id="nomeArquivo"></p>
  <p class="res-estado" id="estado" role="status">Aguardando o arquivo da guia de envio…</p>

  <section id="visualizacao" hidden>
    <p class="viz-info" id="vizInfo"></p>

    <div class="viz-quadro">
      <div class="viz-cab" id="vizCab" aria-live="off" aria-atomic="true"></div>
      <div class="viz-tela" id="vizTela" tabindex="0" role="group" aria-label="Imagem da estrutura. Use as setas do teclado para navegar entre os nós."></div>
    </div>

    <p class="voz-aviso" id="vozAviso" role="status" hidden></p>

    <div class="voz" role="group" aria-label="Controles de voz">
      <button type="button" class="voz-btn" id="vozBtn" aria-pressed="true">Voz: ligada</button>
      <button type="button" class="voz-btn" id="vozRepetir">Repetir</button>
      <div class="voz-vel">
        <span class="vel-rot" id="velRot">Velocidade</span>
        <button type="button" class="vel-btn" id="velMenos" tabindex="-1" aria-label="Diminuir a velocidade">−</button>
        <span class="vel-valor" id="vozVel" role="slider" tabindex="0" aria-labelledby="velRot" aria-valuemin="0" aria-valuemax="5" aria-valuenow="2" aria-valuetext="Normal"><span id="vozVelTxt">Normal (1×)</span></span>
        <button type="button" class="vel-btn" id="velMais" tabindex="-1" aria-label="Aumentar a velocidade">+</button>
      </div>
    </div>
  </section>
</main>

<script src="cabecalho.js"></script>
<script src="desenho.js"></script>
<script src="navegacao.js"></script>
<script src="voz.js"></script>
<script src="resultado.js"></script>
</body>
</html>
